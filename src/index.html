<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Font awesome cdn link -->
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <title>Legal Solution</title>
    <link href="./output.css" rel="stylesheet">
</head>
<body>
    <header class="w-[1170px] m-(--my-margin) pt-16">
        <nav class="flex justify-between items-center ">
            <div class="brand-name">
                <img src="../images/logo2.png" alt="site-logo">
            </div>
            <div class="nav-lists flex list-none dark-03 font-Poppins">
                <li><a class="text-base mx-7" href="#">Home</a></li>
                <li><a class="text-base mx-7" href="#">Services <i class="fa fa-angle-right" aria-hidden="true"></i></a></li>
                <li><a class="text-base mx-7" href="#">Cases <i class="fa fa-angle-right" aria-hidden="true"></i></a></li>
                <li><a class="text-base mx-7" href="#">Blog <i class="fa fa-angle-right" aria-hidden="true"></i></a></li>
                <li><a class="text-base mx-7" href="#">Contact Us <i class="fa fa-angle-right" aria-hidden="true"></i></a></li>
            </div>
            <div>
                <button class="bg-(--bg-btn) text-lg text-white w-[220px] h-[64px] rounded-lg">Free Consultation</button>
            </div>
        </nav>
        <div class="bg-[url(../images/banner.png)] mt-16 min-h-auto bg-center ">
            <div class=" p-12 max-w-[670px] m-(--my-margin)">
                <h1 class="text-center text-white font-eb-garamond text-7xl">We Provide Effective Legal Solutions</h1>
                <p class="text-(--dark-05) text-center font-Poppins p-8">
                    There are many variations of passages of Lorem Ipsum available, but the majority have suffered alteration in some form, by injected humour.
                </p>
            </div>
            <div class="text-center m-(--my-margin) p-12">
                <input class="h-16 w-125 bg-white rounded-lg p-4 text-base mr-6 focus:outline-(--bg-btn) placeholder:text-(--dark-04)"  type="search" name="search" id="search" placeholder="Search you services">
                <input class="h-16 w-37.5 bg-(--bg-btn) rounded-lg p-4 text-xl text-white cursor-pointer" type="submit" value="Search">
            </div>
        </div>
    </header>
</body>
</html>
